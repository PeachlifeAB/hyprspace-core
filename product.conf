# Hyprspace product identity constants.
# Sourced by release and distribution scripts.
# Hyprspace release version is in version.txt (semver e.g. 0.1.0).
# Dev snapshot appends the Hyprspace git short hash e.g. 0.1.0-a4cdfde.
# AeroSpace base version is in aerospace_version.txt.

HYPRSPACE_GITHUB_REPO="PeachlifeAB/hyprspace-core"   # source repo
HYPRSPACE_RELEASES_REPO="PeachlifeAB/hyprspace-releases" # public releases repo (zips hosted here)
HYPRSPACE_TAP_REPO="PeachlifeAB/homebrew-tap"  # public tap repo (cask only)
HYPRSPACE_TAG_PREFIX="v"
HYPRSPACE_CODESIGN_IDENTITY="${HYPRSPACE_CODESIGN_IDENTITY:-Developer ID Application: David Aberg (WA8LW6R2LA)}"
